<footer class="footer">
  <div class="footer-content">
    <!-- Logo -->
    <div class="footer-brand">
      <a routerLink="/" class="logo">Tripma</a>
    </div>

    <!-- Footer Columns -->
    <div class="footer-columns">
      @for (column of footerColumns; track column.title) {
        <div class="footer-column">
          <h4 class="column-title">{{ column.title }}</h4>
          <ul class="column-links">
            @for (link of column.links; track link.route) {
              @if (link.external) {
                <li>
                  <a [href]="link.route" target="_blank" rel="noopener noreferrer">
                    {{ link.label }}
                  </a>
                </li>
              } @else {
                <li>
                  <a [routerLink]="link.route">{{ link.label }}</a>
                </li>
              }
            }
          </ul>
        </div>
      }
    </div>
  </div>
</footer>
