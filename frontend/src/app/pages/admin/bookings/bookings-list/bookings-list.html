<div class="bookings-page">
  <div class="page-header">
    <div class="header-left">
      <h1>Bookings</h1>
      <p>Platform-wide booking overview ({{ totalBookings() }} total)</p>
    </div>
  </div>

  <div class="filters-bar">
    <div class="search-box">
      <input
        type="text"
        placeholder="Search by confirmation code or email..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        (keyup.enter)="onSearch()"
      />
      <button class="btn-search" (click)="onSearch()">Search</button>
    </div>

    <div class="filter-group">
      <select [ngModel]="dateRange()" (ngModelChange)="dateRange.set($event); onFilterChange()">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
      </select>

      <select [ngModel]="airlineFilter()" (ngModelChange)="airlineFilter.set($event); onFilterChange()">
        <option value="all">All Airlines</option>
        @for (airline of airlines(); track airline.id) {
          <option [value]="airline.id">{{ airline.name }}</option>
        }
      </select>

      <select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event); onFilterChange()">
        <option value="all">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
        <option value="completed">Completed</option>
      </select>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="bookings()"
    [loading]="isLoading()"
    emptyMessage="No bookings found"
    emptyHint="Try adjusting your search or filters"
    (sort)="onSort($event)"
    (rowClick)="onRowClick($event)"
  />

  @if (totalPages() > 1) {
    <div class="pagination">
      <button
        class="page-btn"
        [disabled]="currentPage() === 1"
        (click)="onPageChange(currentPage() - 1)"
      >
        Previous
      </button>

      @for (page of getPageNumbers(); track page) {
        <button
          class="page-btn"
          [class.active]="page === currentPage()"
          (click)="onPageChange(page)"
        >
          {{ page }}
        </button>
      }

      <button
        class="page-btn"
        [disabled]="currentPage() === totalPages()"
        (click)="onPageChange(currentPage() + 1)"
      >
        Next
      </button>
    </div>
  }
</div>

<!-- Booking Detail Modal -->
@if (showDetail()) {
  <app-booking-detail
    [booking]="selectedBooking()"
    (close)="closeDetail()"
  />
}
