<div class="date-picker">
  <label class="label">{{ label() }}</label>
  <div class="input-wrapper">
    <input
      type="date"
      class="input"
      [value]="formattedValue()"
      [min]="formattedMinDate()"
      (change)="onChange($event)"
      aria-label="{{ label() }}" />
    <svg class="calendar-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M6.5 2V4M13.5 2V4M2 8H18M4 4H16C17.1046 4 18 4.89543 18 6V16C18 17.1046 17.1046 18 16 18H4C2.89543 18 2 17.1046 2 16V6C2 4.89543 2.89543 4 4 4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>
