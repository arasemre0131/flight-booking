@if (isOpen) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-content" [class]="'variant-' + variant">
      <div class="modal-header">
        <h3>{{ title }}</h3>
      </div>

      <div class="modal-body">
        <p>{{ message }}</p>
      </div>

      <div class="modal-footer">
        <button
          class="btn-cancel"
          (click)="onCancel()"
          [disabled]="loading"
        >
          {{ cancelText }}
        </button>
        <button
          class="btn-confirm"
          [class]="'btn-' + variant"
          (click)="onConfirm()"
          [disabled]="loading"
        >
          @if (loading) {
            <span class="spinner-small"></span>
          }
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
